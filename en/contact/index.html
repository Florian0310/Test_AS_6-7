<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Alles Saniert</title>
    <meta name="description" content="Contact Schroeder - Alles Saniert." />
    <link rel="canonical" href="https://www.allessaniert.at/en/contact/" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="stylesheet" href="../../assets/vendor/icons.css" />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <main id="main-content" class="legal-main">
      <article class="legal-card">
        <h1>Contact</h1>
        <p>Send us your request. We reply as soon as possible.</p>

        <form class="contact-form" data-contact-form novalidate>
          <div class="field-grid">
            <label class="field"><span>First name</span><input name="first_name" type="text" required /></label>
            <label class="field"><span>Last name</span><input name="last_name" type="text" /></label>
          </div>

          <div class="field-grid">
            <label class="field"><span>Email</span><input name="email" type="email" required /></label>
            <label class="field"><span>Phone</span><input name="phone" type="tel" /></label>
          </div>

          <label class="field">
            <span>Subject</span>
            <select name="subject">
              <option>Tool rental request</option>
              <option>Forestry service request</option>
              <option>General question</option>
            </select>
          </label>

          <label class="field"><span>Message</span><textarea name="message" rows="5" required></textarea></label>

          <div class="consent">
            <label class="consent-check">
              <input type="checkbox" name="privacy_consent" required />
              <span>I agree to the</span>
            </label>
            <a class="consent-link" href="../privacy-policy/index.html">Privacy Policy</a>
            <span>.</span>
          </div>

          <label class="visually-hidden-field" aria-hidden="true">
            <span>Website</span>
            <input type="text" name="website" tabindex="-1" autocomplete="off" />
          </label>

          <input type="hidden" name="turnstileToken" />
          <div data-turnstile-container></div>

          <div class="contact-actions">
            <button class="btn-primary" type="submit">Send message</button>
          </div>
          <p class="contact-status is-info" data-contact-status role="status" aria-live="polite"></p>
        </form>

        <p><a href="../index.html">Back to English start page</a></p>
      </article>
    </main>

    <script src="../../app-config.js"></script>
    <script src="../../consent.js"></script>
    <script src="../../script.js"></script>
  </body>
</html>
