# Adapt hostnames, TLS certificates and absolute paths before use.
# Serve ONLY the generated dist/ directory, never the repository root.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
server {
    listen 443 ssl;
    server_name www.allessaniert.at;
    # ssl_certificate /etc/letsencrypt/live/.../fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/.../privkey.pem;
    root /srv/alles-saniert/public;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cms.example.invalid; connect-src 'self' https://cms.example.invalid; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://cms.example.invalid" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location ~ /\. { deny all; }
}
